{% extends "admin/change_list.html" %}
{% load static %}

{% block object-tools-items %}
<li style="position:relative;margin-right:8px;">
  <button id="flagBtn" class="button" style="background:#0d6efd;color:#fff;border-radius:22px;padding:6px 12px;" onclick="toggleFlagMenu()">
    🚩 Export Options <span id="flagArrow">▼</span>
  </button>

  <div id="flagMenu" style="display:none;position:absolute;right:0;top:36px;background:#fff;border:1px solid #ddd;padding:10px;border-radius:8px;min-width:320px;box-shadow:0 6px 18px rgba(0,0,0,0.12);z-index:9999;">
    <div id="flagMenuContent">Loading...</div>
    <div id="flagSpinner" style="display:none;margin-top:8px;text-align:center;">
      <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Exporting...
    </div>
  </div>
</li>

{{ block.super }}
{% endblock %}

{% block extrahead %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/tippy.js/6.3.7/tippy.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tippy.js/6.3.7/tippy.umd.min.js"></script>
{% endblock %}

{% block footer %}
<script>
function toggleFlagMenu(){
    var menu = document.getElementById("flagMenu");
    var arrow = document.getElementById("flagArrow");
    if(menu.style.display === "block"){ menu.style.display = "none"; arrow.textContent = "▼"; }
    else { menu.style.display = "block"; arrow.textContent = "▲"; }
}

// click outside to close
document.addEventListener("click", function(e){
    if(!e.target.closest("#flagMenu") && !e.target.closest("#flagBtn")){
        document.getElementById("flagMenu").style.display = "none";
        document.getElementById("flagArrow").textContent = "▼";
    }
});

function disableLinkIfZero(el, count){
    if(count === 0){
        el.style.pointerEvents = "none";
        el.style.opacity = 0.5;
        el.title = "No records available";
    }
}

// load dynamic counts
document.addEventListener("DOMContentLoaded", function(){
    fetch("{% url 'admin:admin_export_counts' %}")
    .then(r => r.json())
    .then(d => {
        const html = `
        <div style="font-weight:600;margin-bottom:6px;">Completed <span style="float:right;color:green;">${d.completed_total}</span></div>
        <a id="comp_new" href="{% url 'admin:admin_export_flagged' 'completed' 'new' %}" style="display:block;margin-bottom:4px;">• New only <span style="float:right;" class="badge badge-sm bg-primary">${d.completed_new}</span></a>
        <a id="comp_all" href="{% url 'admin:admin_export_flagged' 'completed' 'all' %}" style="display:block;margin-bottom:8px;">• All records <span style="float:right;" class="badge badge-sm bg-info">${d.completed_total}</span></a>
        <hr>
        <div style="font-weight:600;margin-bottom:6px;">Not Completed <span style="float:right;color:orange;">${d.not_completed_total}</span></div>
        <a id="not_new" href="{% url 'admin:admin_export_flagged' 'not_completed' 'new' %}" style="display:block;margin-bottom:4px;">• New only <span style="float:right;" class="badge badge-sm bg-primary">${d.not_completed_new}</span></a>
        <a id="not_all" href="{% url 'admin:admin_export_flagged' 'not_completed' 'all' %}" style="display:block;margin-bottom:8px;">• All records <span style="float:right;" class="badge badge-sm bg-info">${d.not_completed_total}</span></a>
        <hr>
        <div style="font-weight:600;margin-bottom:6px;">All <span style="float:right;color:blue;">${d.all_total}</span></div>
        <a id="all_new" href="{% url 'admin:admin_export_flagged' 'all' 'new' %}" style="display:block;margin-bottom:4px;">• New only <span style="float:right;" class="badge badge-sm bg-primary">${d.all_new}</span></a>
        <a id="all_all" href="{% url 'admin:admin_export_flagged' 'all' 'all' %}" style="display:block;">• All records <span style="float:right;" class="badge badge-sm bg-info">${d.all_total}</span></a>

        <hr>
        <div style="margin-top:6px;">
          <label style="font-weight:600;">Per supplier:</label>
          <form id="supplierExportForm" method="get" action="">
            <select id="supplierSelect" style="width:100%;margin-top:6px;" class="form-select form-select-sm">
              <option value="">-- Select supplier (optional) --</option>
            </select>
            <div style="display:flex;gap:6px;margin-top:8px;">
              <button type="button" id="supplier_new" class="btn btn-sm btn-outline-primary" style="flex:1;">New only</button>
              <button type="button" id="supplier_all" class="btn btn-sm btn-outline-secondary" style="flex:1;">All</button>
            </div>
          </form>
        </div>
        `;
        document.getElementById("flagMenuContent").innerHTML = html;

        // disable options if counts zero
        disableLinkIfZero(document.getElementById("comp_new"), d.completed_new);
        disableLinkIfZero(document.getElementById("not_new"), d.not_completed_new);
        disableLinkIfZero(document.getElementById("all_new"), d.all_new);

        // fetch suppliers list
        fetch("{% url 'admin:staff_supplier_list' %}")
        .then(r => r.json())
        .then(sup => {
            const sel = document.getElementById("supplierSelect");
            sup.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s.code;
                opt.textContent = `${s.code} — ${s.name}`;
                sel.appendChild(opt);
            });
        });

        // supplier button listeners
        document.getElementById("supplier_new").addEventListener("click", function(){
            const sc = document.getElementById("supplierSelect").value;
            if(!sc){ alert("Select a supplier first."); return; }
            window.location.href = `{% url 'admin:admin_export_flagged_supplier' 'all' 'new' %}`.replace("/all/new/", `/${sc}/new/`);
        });
        document.getElementById("supplier_all").addEventListener("click", function(){
            const sc = document.getElementById("supplierSelect").value;
            if(!sc){ alert("Select a supplier first."); return; }
            window.location.href = `{% url 'admin:admin_export_flagged_supplier' 'all' 'all' %}`.replace("/all/all/", `/${sc}/all/`);
        });

    });
});
</script>
{% endblock %}

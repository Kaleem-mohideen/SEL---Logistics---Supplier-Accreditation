<li style="position:relative;margin-right:8px;">
  <button id="flagBtn" class="button" style="background:#0d6efd;color:#fff;border-radius:22px;padding:6px 12px;" onclick="toggleFlagMenu()">
    🚩 Export Options <span id="flagArrow">▼</span>
  </button>

  <div id="flagMenu" style="display:none;position:absolute;right:0;top:36px;background:#fff;border:1px solid #ddd;padding:10px;border-radius:8px;min-width:320px;box-shadow:0 6px 18px rgba(0,0,0,0.12);z-index:9999;">
    <div id="flagMenuContent">Loading...</div>
    <div id="flagSpinner" style="display:none;margin-top:8px;text-align:center;">
      <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Exporting...
    </div>
  </div>

{{ block.super }}
{% endblock %}

{% block extrahead %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/tippy.js/6.3.7/tippy.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tippy.js/6.3.7/tippy.umd.min.js"></script>
<style>
    /* Fix hover inside export dropdown */
    #flagMenu a.export-link:hover {
        background: #8b8686 !important;   /* light grey */
        color: inherit !important;        /* keep original color */
        text-decoration: none !important; /* remove underline */
        border-radius: 4px;
        padding-left: 4px;
    }

    /* Optional: normal state color fix */
    #flagMenu a.export-link {
        color: #333 !important;
        padding: 3px 2px;
        display: block;
    }
</style>

{% endblock %}

{% block footer %}
<script>
// -------------------------------
// Toggle flag menu
// -------------------------------
function toggleFlagMenu(){
    const menu = document.getElementById("flagMenu");
    const arrow = document.getElementById("flagArrow");
    const visible = menu.style.display === "block";
    menu.style.display = visible ? "none" : "block";
    arrow.textContent = visible ? "▼" : "▲";
}

// Close menu when clicking outside
document.addEventListener("click", function(e){
    if(!e.target.closest("#flagMenu") && !e.target.closest("#flagBtn")){
        document.getElementById("flagMenu").style.display = "none";
        document.getElementById("flagArrow").textContent = "▼";
    }
});

// -------------------------------
// Disable item when count = 0
// -------------------------------
function disableLinkIfZero(el, count){
    if(count === 0){
        el.classList.add("disabled-export");
        el.style.pointerEvents = "none";
        el.style.opacity = 0.45;
        el.style.cursor = "not-allowed";
    }
}

// -------------------------------
// Show spinner & disable everything temporarily
// -------------------------------
function startExportUI(){
    document.getElementById("flagSpinner").style.display = "block";
    document.querySelectorAll("#flagMenu a, #flagMenu button").forEach(btn=>{
        btn.disabled = true;
        btn.style.opacity = "0.6";
        btn.style.pointerEvents = "none";
    });
}

function endExportUI(){
    document.getElementById("flagSpinner").style.display = "none";
    document.querySelectorAll("#flagMenu a, #flagMenu button").forEach(btn=>{
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.style.pointerEvents = "auto";
    });
}

// -------------------------------
// AJAX Export Trigger
// -------------------------------
function runExportAjax(url) {
    startExportUI();

    fetch(url)
        .then(async response => {
            if (!response.ok) {
                // Try to read JSON error message from Django
                try {
                    let data = await response.json();
                    throw new Error(data.error || "No records to export");
                } catch {
                    throw new Error("No records to export");
                }
            }

            // Extract filename from header
            let header = response.headers.get("Content-Disposition");
            let filename = "export.zip";
            if (header && header.includes("filename=")) {
                filename = header.split("filename=")[1].replace(/"/g, "");
            }

            let blob = await response.blob();
            return { blob, filename };
        })
        .then(({ blob, filename }) => {
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();

            updateCounts();
        })
        .catch(err => alert("Export failed: " + err.message))
        .finally(() => endExportUI());
}


// -------------------------------
// Reload export counts instantly (without reload)
// -------------------------------
function updateCounts(){
    fetch("{% url 'admin:admin_export_counts' %}")
        .then(r => r.json())
        .then(d => renderMenu(d));
}

// -------------------------------
// Build menu (dynamic rendering)
// -------------------------------
function renderMenu(d){

    const html = `
    <div style="font-weight:600;margin-bottom:6px;">
        Completed 
        <span style="float:right;color:green;">${d.completed_total}</span>
    </div>

    <a id="comp_new" data-url="{% url 'admin:admin_export_flagged' 'completed' 'new' %}"
      class="export-link" style="display:block;margin-bottom:4px;">
      • New only 
      <span class="badge badge-sm bg-primary" 
            style="float:right; margin-left:2px;">${d.completed_new}</span>
    </a>

    <a id="comp_all" data-url="{% url 'admin:admin_export_flagged' 'completed' 'all' %}"
      class="export-link" style="display:block;margin-bottom:8px;">
      • All records
      <span class="badge badge-sm bg-info" 
            style="float:right; margin-left:2px;">${d.completed_total}</span>
    </a>

    <hr>

    <div style="font-weight:600;margin-bottom:6px;">
        Not Completed 
        <span style="float:right;color:orange;">${d.not_completed_total}</span>
    </div>

    <a id="not_new" data-url="{% url 'admin:admin_export_flagged' 'not_completed' 'new' %}"
      class="export-link" style="display:block;margin-bottom:4px;">
      • New only 
      <span class="badge badge-sm bg-primary" 
            style="float:right; margin-left:2px;">${d.not_completed_new}</span>
    </a>

    <a id="not_all" data-url="{% url 'admin:admin_export_flagged' 'not_completed' 'all' %}"
      class="export-link" style="display:block;margin-bottom:8px;">
      • All records
      <span class="badge badge-sm bg-info" 
            style="float:right; margin-left:2px;">${d.not_completed_total}</span>
    </a>

    <hr>

    <div style="font-weight:600;margin-bottom:6px;">
        All 
        <span style="float:right;color:blue;">${d.all_total}</span>
    </div>

    <a id="all_new" data-url="{% url 'admin:admin_export_flagged' 'all' 'new' %}"
      class="export-link" style="display:block;margin-bottom:4px;">
      • New only 
      <span class="badge badge-sm bg-primary" 
            style="float:right; margin-left:2px;">${d.all_new}</span>
    </a>

    <a id="all_all" data-url="{% url 'admin:admin_export_flagged' 'all' 'all' %}"
      class="export-link" style="display:block;">
      • All records
      <span class="badge badge-sm bg-info" 
            style="float:right; margin-left:2px;">${d.all_total}</span>
    </a>


    <hr>
    <strong>Per supplier:</strong>
    <select id="supplierSelect" class="form-select form-select-sm" style="margin-top:6px;"></select>

    <div style="display:flex;gap:6px;margin-top:8px;">
        <button id="supplier_new" class="btn btn-sm btn-outline-primary" style="flex:1;">New only</button>
        <button id="supplier_all" class="btn btn-sm btn-outline-secondary" style="flex:1;">All</button>
    </div>
    `;

    document.getElementById("flagMenuContent").innerHTML = html;

    disableLinkIfZero(document.getElementById("comp_new"), d.completed_new);
    disableLinkIfZero(document.getElementById("not_new"), d.not_completed_new);
    disableLinkIfZero(document.getElementById("all_new"), d.all_new);

    // Bind export click events
    document.querySelectorAll(".export-link").forEach(el => {
        el.addEventListener("click", function(e){
            e.preventDefault();
            const url = el.dataset.url.replace("download=true","ajax=true");
            runExportAjax(url);
        });
    });

    loadSupplierList();
}

// -------------------------------
// Supplier dropdown
// -------------------------------
function loadSupplierList(){
    fetch("{% url 'admin:staff_supplier_list' %}")
    .then(r => r.json())
    .then(sup => {
        let sel = document.getElementById("supplierSelect");
        sel.innerHTML = "<option value=''>-- Select supplier --</option>";
        sup.forEach(s => {
            sel.innerHTML += `<option value="${s.code}">${s.code} — ${s.name}</option>`;
        });

                // supplier button listeners
        // document.getElementById("supplier_new").addEventListener("click", function(){
        //     const sc = document.getElementById("supplierSelect").value;
        //     if(!sc){ alert("Select a supplier first."); return; }
        //     window.location.href = `{% url 'admin:admin_export_flagged_supplier' 'all' 'new' %}`.replace("/all/new/", `/${sc}/new/`);
        // });
        // document.getElementById("supplier_all").addEventListener("click", function(){
        //     const sc = document.getElementById("supplierSelect").value;
        //     if(!sc){ alert("Select a supplier first."); return; }
        //     window.location.href = `{% url 'admin:admin_export_flagged_supplier' 'all' 'all' %}`.replace("/all/all/", `/${sc}/all/`);
        // });
        document.getElementById("supplier_new").onclick = function(){
            let sc = sel.value;
            if(!sc){ alert("Select supplier first"); return; }
            runExportAjax(`/admin/staff/staffmember/export/flag/supplier/${sc}/new/?ajax=1`);
        };
        document.getElementById("supplier_all").onclick = function(){
            let sc = sel.value;
            if(!sc){ alert("Select supplier first"); return; }
            runExportAjax(`/admin/staff/staffmember/export/flag/supplier/${sc}/all/?ajax=1`);
        };
    });
}


// -------------------------------
// Load menu initially
// -------------------------------
document.addEventListener("DOMContentLoaded", updateCounts);
</script>
{% endblock %}
